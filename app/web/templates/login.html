{% extends "base.html" %}

{% block title %}登录 · {{ app_name }}{% endblock %}
{% block subtitle %}登录{% endblock %}

{% block content %}
  <section class="card" style="max-width:420px;margin:24px auto;">
    <h2>登录</h2>
    <p class="muted">演示口令统一为 <code>Passw0rd!</code></p>

    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}" />
      <div class="form-row">
        <label for="username">账号</label>
        <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" required />
      </div>
      <div class="form-row">
        <label for="password">口令</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit">登录</button>
    </form>

    <h3 style="margin-top:22px;font-size:15px;">演示账号</h3>
    <div class="chips">
      <span class="chip">农户<code>farmer01</code></span>
      <span class="chip">运营<code>operator01</code></span>
      <span class="chip">监管<code>regulator01</code></span>
      <span class="chip">消费者<code>consumer01</code></span>
    </div>
  </section>
{% endblock %}
