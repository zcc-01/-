{% extends "base.html" %}

{% block title %}未查询到溯源信息{% endblock %}

{% block content %}

    <h1>未查询到该产品信息</h1>
    <p class="muted">{{ message }}</p>
    <p class="muted">错误码：{{ code }}</p>
    <p>请核对包装上的溯源码是否完整，或联系卖家确认。若刚完成赋码，二维码可能存在印刷延迟。</p>
    <a class="btn" href="/">返回首页</a>
  </section>
{% endblock %}

{% block footer %}
  <span>农产品溯源与产地直供电商平台</span>
{% endblock %}
