[project]
name = "agri-trace-platform"
version = "1.0.0"
description = "农产品溯源与产地直供电商平台 · 溯源链域与公共基础"
requires-python = ">=3.11"
dependencies = [
  "python-multipart>=0.0.9",
    "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "pydantic>=2.8,<3.0",
  "PyJWT>=2.8,<3.0",
  "bcrypt>=4.0,<5.0",
  "jinja2>=3.1,<4.0",
  "qrcode[pil]>=7.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".git", ".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI 的 Depends(...) 默认参数写法
