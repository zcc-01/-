name: 缺陷
description: 记录测试或联调中发现的问题
title: "[缺陷] "
labels: ["bug"]
body:
  - type: input
    id: env
    attributes:
      label: 复现环境
      placeholder: "本地 / Codespaces，Python 3.11，SQLite"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. POST /api/batches ...
        2. 观察返回 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options: ["阻塞（无法演示）", "严重（主流程受影响）", "一般", "建议"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 请附 X-Request-ID，便于定位
